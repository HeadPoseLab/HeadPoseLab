# Data
data_root: /Users/sanjin/CursorProject/HeadPoseLab/pose_model/data
head_dir: head_pose
hand_dir: hand_pose
sequence_length: 24
overlap: true
train_ratio: 0.7
val_ratio: 0.2
seed: 42
image_size: 128
hand_roi:
  enabled: true
  expand: 1.6
  min_scale: 0.2

# Optional image augmentation (active only when model requires images)
augment:
  enabled: false
  hflip_p: 0.5
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  affine:
    p: 0.35
    degrees: 8.0
    translate: 0.03
    scale_min: 0.95
    scale_max: 1.05
    shear: 3.0
  blur:
    p: 0.2
    kernel_size: 3
    sigma_min: 0.1
    sigma_max: 1.2
  erasing:
    p: 0.15
    scale_min: 0.02
    scale_max: 0.12
    ratio_min: 0.3
    ratio_max: 3.3
    value: 0.0

# Dataloader
batch_size: 16
num_workers: 4
sampler:
  balanced: true
  sample_weight_head: 0.8
  sample_weight_hand: 0.2

# Model (first-principles: geometry-first)
model:
  architecture: geometry_first
  num_head_classes: 5
  num_hand_classes: 4
  geom_dim: 128
  geometry_temporal:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.1
    bidirectional: false
  head_attention_pool: true
  head_attention_dropout: 0.1
  hand_attention_pool: true
  hand_attention_dropout: 0.1
  appearance_expert:
    enabled: false
    backbone: simple_cnn
    feature_dim: 96
    shared_backbone: true
    dropout: 0.1
  freeze_backbone: false
  freeze_stages: -1

# Loss
loss:
  type: cross_entropy
  head_type: focal
  hand_type: cross_entropy
  class_weights: auto
  focal_gamma: 2.0
  head_focal_gamma: 1.5
  hand_focal_gamma: 2.0
  head_weight: 1.8
  hand_weight: 0.5

# Optimization
train:
  epochs: 120
  lr: 0.0005
  backbone_lr_scale: 0.2
  weight_decay: 0.0005
  grad_clip: 1.0
  device: auto
  save_dir: ./checkpoints/exp_geometry_first
  log_interval: 10
  log_dir: ./runs/exp_geometry_first
  freeze_backbone_epochs: 0
  selection_metric: head_f1
  selection_mode: max
  early_stop_patience: 25
  scheduler:
    enabled: true
    type: warmup_cosine
    warmup_epochs: 5
    min_lr_ratio: 0.05

# Evaluation
eval:
  checkpoint: ./checkpoints/exp_geometry_first/best_head_f1.pt
  hand_unknown_threshold: 0.0
  hand_unknown_class: 4

# Inference
inference:
  hand_unknown_threshold: 0.0
  hand_unknown_class: 4
  smoothing:
    enabled: true
    window: 5
